version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # image: healthinsight_backend
    container_name: healthinsight_backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # image: healthinsight_frontend
    container_name: healthinsight_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
